[project]
name = "battuta-memory"
version = "0.1.0"
description = "Battuta's shared headless memory MCP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp-memory-service[sqlite]==12.1.1",
  "mcp>=1.26,<2",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battuta_memory"]
