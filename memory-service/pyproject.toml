[project]
name = "battuta-memory"
dynamic = ["version"]
description = "Battuta's shared headless memory MCP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp-memory-service[sqlite]==12.1.1",
  "mcp>=1.26,<2",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
battuta-memory = "battuta_memory.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battuta_memory"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
