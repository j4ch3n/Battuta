[project]
name = "battuta-memory"
dynamic = ["version"]
description = "Battuta's shared headless memory MCP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-memory-core[cjk]",
  "agent-memory-executor",
  "agent-memory-mcp",
  "click>=8.1,<9",
  "json-repair>=0.64.9,<1",
  "stopwordsiso>=0.7.1,<1",
  "mcp>=1.26,<2",
  "numpy>=2,<3",
  "onnxruntime>=1.22,<2",
  "starlette>=0.47,<1",
  "tokenizers>=0.21,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-bdd>=9,<10"]

[project.scripts]
battuta-memory = "battuta_memory.cli:main"

[tool.uv.sources]
agent-memory-core = { git = "https://github.com/tigerless-labs/agent-memory", rev = "2648ba02d3c0364f9787f0e8fb49f69f47d2e3f7", subdirectory = "packages/core" }
agent-memory-executor = { git = "https://github.com/tigerless-labs/agent-memory", rev = "2648ba02d3c0364f9787f0e8fb49f69f47d2e3f7", subdirectory = "packages/executor" }
agent-memory-mcp = { git = "https://github.com/tigerless-labs/agent-memory", rev = "2648ba02d3c0364f9787f0e8fb49f69f47d2e3f7", subdirectory = "packages/mcp" }

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battuta_memory"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: crosses packages or processes; lives in tests/integration/"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
