name: Release Oracle Linux ARM64 package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: validate
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release provenance and calculate tool version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          echo "version=${TAG#v}+g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Oracle Linux toolchain image
        run: |
          docker build -t battuta-release \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@")[1])')" \
            - < scripts/packaging/OracleLinux.Dockerfile
      - name: Assemble release
        env:
          TAG: ${{ github.ref_name }}
          TOOL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/assets" battuta-release \
            bash /source/scripts/packaging/release-build.sh "$TAG" "$TOOL_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  prerelease:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Expose immutable candidate wheel URLs for installation checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --prerelease --generate-notes

  verify-install:
    needs: [prerelease]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Download the actual published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --dir dist
      - name: Build clean Oracle Linux toolchain image
        run: |
          docker build -t battuta-verify \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@")[1])')" \
            - < scripts/packaging/OracleLinux.Dockerfile
      - name: Install and verify without models or bot startup
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/assets:ro" \
            -e BATTUTA_RELEASE_ASSETS=/assets -e BATTUTA_RELEASE_TAG="$TAG" \
            battuta-verify uv run --no-project --python 3.12 \
            python /source/scripts/packaging/tests/release_install.it.py

  promote:
    needs: [verify-install]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Promote the tested assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --prerelease=false --latest
