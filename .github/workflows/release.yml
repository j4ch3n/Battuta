name: Release Raspberry Pi package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: validate
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release provenance and calculate tool version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          echo "version=${TAG#v}+g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  wheels:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: battuta-project
            path: project-context-cli
          - package: battuta-artifacts
            path: artifact-service
          - package: battuta-memory
            path: memory-service
          - package: battuta-bot-setup
            path: scripts/bot_setup
          - package: battuta-packaging
            path: scripts/packaging
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - name: Build wheel and export locked runtime constraints
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          PROJECT: ${{ matrix.path }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          uv build "$PROJECT" --wheel --out-dir dist
          uv export --project "$PROJECT" --frozen --no-dev --no-emit-project \
            --no-emit-package battuta-project --no-emit-package battuta-bot-setup \
            --no-hashes --format requirements-txt --output-file "dist/$PACKAGE-constraints.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  verify-tools:
    needs: [prepare, wheels]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Verify isolated tools, resources, and native memory loading
        env:
          BATTUTA_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BATTUTA_RELEASE_WHEELS: ${{ github.workspace }}/dist
          BATTUTA_NATIVE_SMOKE: "1"
        run: uv run --project scripts/packaging --locked python scripts/packaging/tests/wheels.it.py
      - name: Record version and checksums
        env:
          TOOL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$TOOL_VERSION" > dist/python-tools-version.txt
          cd dist
          sha256sum *.whl *-constraints.txt python-tools-version.txt > python-tools-SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: python-tools
          path: dist/*
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Validate skill manifests
        run: pnpm check:skills

      - name: Assemble release
        env:
          TAG: ${{ github.ref_name }}
          TOOL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage/battuta/bin
          git archive HEAD bots scripts/bot_setup/run-dev.sh scripts/bot_setup/run-worker.sh scripts/bot_setup/wait-for-assignments.mjs skills-hub agent-mail project-spec memory-client scripts/setup-memory.sh scripts/setup-artifacts.sh .env.example RELEASE.md docs/skill-management.md docs/gogcli-setup.md docs/luma-setup.md docs/luma.md docs/memory-service.md docs/memory-service-setup.md docs/artifact-service.md docs/artifact-service-setup.md docs/subagents-setup.md docs/assignments.md docs/assignments-setup.md docs/workers.md docs/workers-setup.md | tar -x -C dist/stage/battuta
          printf '%s\n' "$TOOL_VERSION" > dist/stage/battuta/python-tools-version.txt
          test -s dist/stage/battuta/RELEASE.md
          git archive HEAD docs/workers.md docs/workers-setup.md docs/scheduler.md | tar -x -C dist/stage/battuta
          test -s dist/stage/battuta/docs/gogcli-setup.md
          test -s dist/stage/battuta/docs/luma-setup.md
          test -s dist/stage/battuta/docs/luma.md
          test -s dist/stage/battuta/skills-hub/memory/references/tools.md
          test ! -e dist/stage/battuta/bots/AGENTS_personal.md
          cp "$(command -v node)" dist/stage/battuta/bin/node
          cp scripts/packaging/battuta dist/stage/battuta/bin/battuta
          chmod +x dist/stage/battuta/bin/*
          test -d dist/stage/battuta/skills-hub
          uv run --project scripts/packaging --locked battuta-packaging validate-skills dist/stage/battuta
          for bot in cos-bot manager-bot; do
            test ! -e "dist/stage/battuta/bots/$bot/.pi/ME.md"
          done
          bash -n dist/stage/battuta/bin/battuta
          for bot in cos-bot manager-bot; do
            bot_dir="$PWD/dist/stage/battuta/bots/$bot"
            pnpm --dir "$bot_dir" install --frozen-lockfile --prod
            while IFS=$'\t' read -r source package; do
              PI_CODING_AGENT_DIR="$bot_dir/.pi" pnpm --dir "$bot_dir" exec pi install -l --approve "$source"
              test -d "$bot_dir/.pi/npm/node_modules/$package"
            done < <(node -e '
              const { readFileSync } = require("node:fs");
              const settings = JSON.parse(readFileSync(process.argv[1], "utf8"));
              for (const entry of settings.packages ?? []) {
                const source = typeof entry === "string" ? entry : entry?.source;
                if (typeof source !== "string" || !source.startsWith("npm:")) continue;
                const packageName = source.slice(4).replace(/@[^@/]+$/, "");
                console.log(`${source}\t${packageName}`);
              }
            ' "$bot_dir/.pi/settings.json")
            test ! -e "$bot_dir/.pi/skills"
          done
          pnpm --dir dist/stage/battuta/agent-mail install --frozen-lockfile --prod
          pnpm --dir dist/stage/battuta/project-spec install --frozen-lockfile --prod
          pnpm --dir dist/stage/battuta/memory-client install --frozen-lockfile --prod
          worker_runtime="$PWD/dist/stage/battuta/bots/worker/extension/assignment-worker"
          pnpm --dir "$worker_runtime" install --frozen-lockfile --prod
          test -f dist/stage/battuta/bots/worker/.pi/web-search.json
          test -f "$worker_runtime/index.ts"
          test -f "$worker_runtime/node_modules/@earendil-works/pi-coding-agent/dist/extensions/mcp/index.js"
          test -f "$worker_runtime/node_modules/@earendil-works/pi-coding-agent/dist/extensions/codemode/index.js"
          bash -n dist/stage/battuta/scripts/bot_setup/run-worker.sh
          memory_smoke_home="$(mktemp -d)"
          mkdir -p "$memory_smoke_home/agent"
          HOME="$memory_smoke_home" node dist/stage/battuta/memory-client/tests/loader-worker.mjs "$memory_smoke_home/agent" "$PWD/dist/stage/battuta/bots/cos-bot/node_modules/@earendil-works/pi-coding-agent/dist/index.js" "$PWD/dist/stage/battuta/bots/cos-bot/.pi/npm/node_modules/@jl1990/pi-scheduler/extensions/scheduler/index.ts"
          rm -rf "$memory_smoke_home"
          test -x dist/stage/battuta/bots/cos-bot/node_modules/.bin/pi
          test -x dist/stage/battuta/bots/manager-bot/node_modules/.bin/pi
          test -f dist/stage/battuta/bots/manager-bot/.pi/npm/node_modules/pi-subagents/bundle/index.js
          test -f dist/stage/battuta/bots/manager-bot/.pi/npm/node_modules/pi-subagents/skills/pi-subagents/SKILL.md
          test ! -e dist/stage/battuta/bots/cos-bot/node_modules/pi-subagents
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/subagents.json
          pnpm --dir dist/stage/battuta/bots/manager-bot exec node --input-type=module -e 'import upstream from "pi-subagents"; import { SUBAGENT_DELEGATION_REQUEST_EVENT } from "pi-subagents/delegation"; if (typeof upstream !== "function" || !SUBAGENT_DELEGATION_REQUEST_EVENT) process.exit(1)'
          test -d dist/stage/battuta/agent-mail/node_modules
          test -d dist/stage/battuta/project-spec/node_modules
          test -d dist/stage/battuta/memory-client/node_modules
          test ! -e dist/stage/battuta/.env
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/mcp-auth.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/mcp-auth.json
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/telegram.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/telegram.json
          test ! -e dist/stage/battuta/project-context-cli
          test ! -e dist/stage/battuta/memory-service
          test ! -e dist/stage/battuta/artifact-service
          test ! -e dist/stage/battuta/scripts/packaging
          test ! -e dist/stage/battuta/scripts/bot_setup/src
          tar -C dist/stage -czf "dist/battuta-$TAG-linux-arm64.tar.gz" battuta
          (cd dist && sha256sum "battuta-$TAG-linux-arm64.tar.gz" > "battuta-$TAG-linux-arm64.tar.gz.sha256")

      - uses: actions/upload-artifact@v6
        with:
          name: bot-archive
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [build, verify-tools]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: bot-archive
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: python-tools
          path: dist
      - name: Publish GitHub Release and verify downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --verify-tag --generate-notes
          gh release download "$TAG" --dir "$RUNNER_TEMP/published-tools" --pattern '*.whl' --pattern '*-constraints.txt' --pattern 'python-tools-*'
          cd "$RUNNER_TEMP/published-tools"
          sha256sum -c python-tools-SHA256SUMS
