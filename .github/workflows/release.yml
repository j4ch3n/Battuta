name: Release Raspberry Pi package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"

      - name: Require tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Assemble release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage/battuta/bin
          git archive HEAD bots shared-skills agent-mail .env.example RELEASE.md | tar -x -C dist/stage/battuta
          test -s dist/stage/battuta/RELEASE.md
          cli_dir="$PWD/dist/stage/battuta/shared-skills/project-context-cli"
          uv export --project "$cli_dir" --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/project-requirements.txt"
          uv build --project "$cli_dir" --wheel --out-dir "$cli_dir/wheels"
          python3 -m pip download --require-hashes --no-deps --only-binary=:all: --dest "$cli_dir/wheels" -r "$RUNNER_TEMP/project-requirements.txt"
          cp "$(command -v node)" dist/stage/battuta/bin/node
          cp packaging/battuta dist/stage/battuta/bin/battuta
          cp packaging/configure.mjs dist/stage/battuta/bin/configure.mjs
          cp packaging/install-services.mjs dist/stage/battuta/bin/install-services.mjs
          chmod +x dist/stage/battuta/bin/*
          for bot in pm-bot tl-bot; do
            mkdir -p "dist/stage/battuta/bots/$bot/.pi/skills"
            ln -s ../../../../shared-skills/project-context "dist/stage/battuta/bots/$bot/.pi/skills/project-context"
            test -f "dist/stage/battuta/bots/$bot/.pi/skills/project-context/SKILL.md"
            source_references="dist/stage/battuta/shared-skills/project-context/references"
            runtime_references="dist/stage/battuta/bots/$bot/.pi/skills/project-context/references"
            ls -l "$runtime_references/"
            for document in "$source_references"/*/*.md; do
              test -f "$document" || continue
              relative_document="${document#"$source_references/"}"
              test -f "$runtime_references/$relative_document"
            done
          done
          bash -n dist/stage/battuta/bin/battuta
          node --check dist/stage/battuta/bin/install-services.mjs
          export UV_TOOL_DIR="$RUNNER_TEMP/project-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/project-tool-bin"
          uv tool install --offline --python 3.12 --no-index --find-links "$cli_dir/wheels" battuta-project
          skill_cli="$UV_TOOL_BIN_DIR/battuta-project"
          export LINEAR_API_TOKEN=release-smoke
          "$skill_cli" --help
          smoke_home="$(mktemp -d)"
          HOME="$smoke_home" python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.home() / ".battuta/projects/release-smoke"
          code = root / "code"
          code.mkdir(parents=True)
          (code / "README.md").write_text("# Release smoke\n")
          (root / "project.yaml").write_text(json.dumps({
              "version": 1,
              "project": {"name": "release-smoke", "path": str(code)},
              "linear": {"project_id": None, "team_id": None},
              "github": {"repository": None},
          }))
          PY
          HOME="$smoke_home" "$skill_cli" switch release-smoke
          HOME="$smoke_home" "$skill_cli" explain
          HOME="$smoke_home" "$UV_TOOL_DIR/battuta-project/bin/python" - <<'PY'
          from battuta_project.presentation import render
          from battuta_project.registry import ProjectRegistry

          summary = render("summary.md.j2", ProjectRegistry().current())
          assert summary.startswith("# Project Summary: release-smoke\n")
          assert "## Specifications" in summary
          assert "{{" not in summary
          PY
          HOME="$smoke_home" "$skill_cli" memory append 'Verified release installation.'
          test "$(HOME="$smoke_home" "$skill_cli" memory get)" = '1: Verified release installation.'
          rm -rf "$smoke_home"
          for bot in pm-bot tl-bot; do
            bot_dir="$PWD/dist/stage/battuta/bots/$bot"
            pnpm --dir "$bot_dir" install --frozen-lockfile --prod
            PI_CODING_AGENT_DIR="$bot_dir/.pi" "$bot_dir/node_modules/.bin/pi" install -l --approve npm:@llblab/pi-telegram@0.50.1
          done
          pnpm --dir dist/stage/battuta/agent-mail install --frozen-lockfile --prod
          test -x dist/stage/battuta/bots/pm-bot/node_modules/.bin/pi
          test -x dist/stage/battuta/bots/tl-bot/node_modules/.bin/pi
          test -d dist/stage/battuta/agent-mail/node_modules
          test ! -e dist/stage/battuta/.env
          test ! -e dist/stage/battuta/bots/pm-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/tl-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/pm-bot/.pi/telegram.json
          test ! -e dist/stage/battuta/bots/tl-bot/.pi/telegram.json
          tar -C dist/stage -czf "dist/battuta-$TAG-linux-arm64.tar.gz" battuta
          (cd dist && sha256sum "battuta-$TAG-linux-arm64.tar.gz" > "battuta-$TAG-linux-arm64.tar.gz.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/battuta-$TAG-linux-arm64.tar.gz" "dist/battuta-$TAG-linux-arm64.tar.gz.sha256" --verify-tag --generate-notes
