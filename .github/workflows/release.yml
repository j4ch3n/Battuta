name: Release Raspberry Pi package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"

      - name: Require tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Validate skill manifests
        run: pnpm check:skills

      - name: Assemble release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage/battuta/bin
          git archive HEAD bots scripts/bot_setup scripts/packaging skills-hub project-context-cli agent-mail project-spec memory-client memory-service artifact-service scripts/setup-memory.sh scripts/setup-artifacts.sh .env.example RELEASE.md docs/skill-management.md docs/gogcli-setup.md docs/luma-setup.md docs/luma.md docs/memory-service.md docs/memory-service-setup.md docs/artifact-service.md docs/artifact-service-setup.md docs/subagents-setup.md docs/assignments.md docs/assignments-setup.md docs/workers.md docs/workers-setup.md | tar -x -C dist/stage/battuta
          test -s dist/stage/battuta/RELEASE.md
          git archive HEAD docs/workers.md docs/workers-setup.md | tar -x -C dist/stage/battuta
          test -s dist/stage/battuta/docs/gogcli-setup.md
          test -s dist/stage/battuta/docs/luma-setup.md
          test -s dist/stage/battuta/docs/luma.md
          test -s dist/stage/battuta/skills-hub/memory/references/tools.md
          test ! -e dist/stage/battuta/bots/AGENTS_personal.md
          tool_dir="$PWD/dist/stage/battuta/scripts/packaging"
          uv export --project "$tool_dir" --locked --no-dev --no-emit-project --no-emit-package battuta-bot-setup --format requirements-txt --output-file "$RUNNER_TEMP/tool-requirements.txt"
          uv build --project "$PWD/dist/stage/battuta/scripts/bot_setup" --wheel --out-dir "$tool_dir/wheels"
          uv build --project "$tool_dir" --wheel --out-dir "$tool_dir/wheels"
          python3 -m pip download --require-hashes --no-deps --only-binary=:all: --dest "$tool_dir/wheels" -r "$RUNNER_TEMP/tool-requirements.txt"
          (cd "$tool_dir/wheels" && sha256sum *.whl > SHA256SUMS)
          cli_dir="$PWD/dist/stage/battuta/project-context-cli"
          uv export --project "$cli_dir" --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/project-requirements.txt"
          uv build --project "$cli_dir" --wheel --out-dir "$cli_dir/wheels"
          python3 -m pip download --require-hashes --no-deps --only-binary=:all: --dest "$cli_dir/wheels" -r "$RUNNER_TEMP/project-requirements.txt"
          memory_dir="$PWD/dist/stage/battuta/memory-service"
          uv export --project "$memory_dir" --locked --no-dev --no-emit-project --format requirements-txt --output-file "$memory_dir/requirements.txt"
          uv build "$memory_dir" --wheel --out-dir "$memory_dir/wheels"
          python3 -m pip download --require-hashes --no-deps --only-binary=:all: --dest "$memory_dir/wheels" -r "$memory_dir/requirements.txt"
          (cd "$memory_dir/wheels" && sha256sum *.whl > SHA256SUMS)
          artifact_dir="$PWD/dist/stage/battuta/artifact-service"
          uv export --project "$artifact_dir" --locked --no-dev --no-emit-project --no-emit-package battuta-project --format requirements-txt --output-file "$artifact_dir/requirements.txt"
          uv build "$artifact_dir" --wheel --out-dir "$artifact_dir/wheels"
          cp "$cli_dir"/wheels/battuta_project-*.whl "$artifact_dir/wheels/"
          python3 -m pip download --require-hashes --no-deps --only-binary=:all: --dest "$artifact_dir/wheels" -r "$artifact_dir/requirements.txt"
          (cd "$artifact_dir/wheels" && sha256sum *.whl > SHA256SUMS)
          cp "$(command -v node)" dist/stage/battuta/bin/node
          cp scripts/packaging/battuta dist/stage/battuta/bin/battuta
          chmod +x dist/stage/battuta/bin/*
          test -d dist/stage/battuta/skills-hub
          uv run --project scripts/packaging --locked battuta-packaging validate-skills dist/stage/battuta
          for bot in cos-bot manager-bot; do
            test ! -e "dist/stage/battuta/bots/$bot/.pi/ME.md"
          done
          bash -n dist/stage/battuta/bin/battuta
          export UV_TOOL_DIR="$RUNNER_TEMP/project-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/project-tool-bin"
          uv tool install --offline --python 3.12 --no-index --find-links "$cli_dir/wheels" battuta-project
          skill_cli="$UV_TOOL_BIN_DIR/battuta-project"
          export LINEAR_API_TOKEN=release-smoke
          "$skill_cli" --help
          smoke_home="$(mktemp -d)"
          HOME="$smoke_home" python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.home() / ".battuta/projects/release-smoke"
          code = root / "code"
          code.mkdir(parents=True)
          (code / "README.md").write_text("# Release smoke\n")
          (root / "project.yaml").write_text(json.dumps({
              "version": 1,
              "project": {"name": "release-smoke", "path": str(code)},
              "linear": {"project_id": None, "team_id": None},
              "github": {"repository": None},
          }))
          PY
          HOME="$smoke_home" "$skill_cli" switch release-smoke
          HOME="$smoke_home" "$skill_cli" explain
          HOME="$smoke_home" "$UV_TOOL_DIR/battuta-project/bin/python" - <<'PY'
          from battuta_project.presentation import render
          from battuta_project.registry import ProjectRegistry

          summary = render("summary.md.j2", ProjectRegistry().current())
          assert summary.startswith("# Project Summary: release-smoke\n")
          assert "## Specifications" in summary
          assert "{{" not in summary
          PY
          rm -rf "$smoke_home"
          for bot in cos-bot manager-bot; do
            bot_dir="$PWD/dist/stage/battuta/bots/$bot"
            pnpm --dir "$bot_dir" install --frozen-lockfile --prod
            while IFS=$'\t' read -r source package; do
              PI_CODING_AGENT_DIR="$bot_dir/.pi" pnpm --dir "$bot_dir" exec pi install -l --approve "$source"
              test -d "$bot_dir/.pi/npm/node_modules/$package"
            done < <(node -e '
              const { readFileSync } = require("node:fs");
              const settings = JSON.parse(readFileSync(process.argv[1], "utf8"));
              for (const entry of settings.packages ?? []) {
                const source = typeof entry === "string" ? entry : entry?.source;
                if (typeof source !== "string" || !source.startsWith("npm:")) continue;
                const packageName = source.slice(4).replace(/@[^@/]+$/, "");
                console.log(`${source}\t${packageName}`);
              }
            ' "$bot_dir/.pi/settings.json")
            test ! -e "$bot_dir/.pi/skills"
          done
          pnpm --dir dist/stage/battuta/agent-mail install --frozen-lockfile --prod
          pnpm --dir dist/stage/battuta/project-spec install --frozen-lockfile --prod
          pnpm --dir dist/stage/battuta/memory-client install --frozen-lockfile --prod
          worker_runtime="$PWD/dist/stage/battuta/bots/worker/extension/assignment-worker"
          pnpm --dir "$worker_runtime" install --frozen-lockfile --prod
          test -f "$worker_runtime/node_modules/pi-web-access/package.json"
          test -f "$worker_runtime/index.ts"
          test -f "$worker_runtime/node_modules/@earendil-works/pi-coding-agent/dist/extensions/mcp/index.js"
          test -f "$worker_runtime/node_modules/@earendil-works/pi-coding-agent/dist/extensions/codemode/index.js"
          bash -n dist/stage/battuta/scripts/bot_setup/run-worker.sh
          memory_smoke_home="$(mktemp -d)"
          mkdir -p "$memory_smoke_home/agent"
          HOME="$memory_smoke_home" node dist/stage/battuta/memory-client/tests/loader-worker.mjs "$memory_smoke_home/agent" "$PWD/dist/stage/battuta/bots/cos-bot/node_modules/@earendil-works/pi-coding-agent/dist/index.js" "$PWD/dist/stage/battuta/bots/cos-bot/.pi/npm/node_modules/@jl1990/pi-scheduler/extensions/scheduler/index.ts"
          uv venv --python 3.12 "$RUNNER_TEMP/memory-smoke"
          uv pip install --python "$RUNNER_TEMP/memory-smoke/bin/python" --offline --no-index --find-links "$memory_dir/wheels" battuta-memory
          "$RUNNER_TEMP/memory-smoke/bin/battuta-memory" --help
          uv venv --python 3.12 "$RUNNER_TEMP/artifact-smoke"
          uv pip install --python "$RUNNER_TEMP/artifact-smoke/bin/python" --offline --no-index --find-links "$artifact_dir/wheels" battuta-artifacts
          "$RUNNER_TEMP/artifact-smoke/bin/battuta-artifact" --help
          BATTUTA_ARTIFACT_DB="$RUNNER_TEMP/artifact-smoke/registry.sqlite3" "$RUNNER_TEMP/artifact-smoke/bin/battuta-artifact" setup
          BATTUTA_ARTIFACT_DB="$RUNNER_TEMP/artifact-smoke/registry.sqlite3" "$RUNNER_TEMP/artifact-smoke/bin/battuta-artifact" list --json
          "$RUNNER_TEMP/artifact-smoke/bin/python" -c 'from importlib.resources import files; from battuta_artifacts.bundles import load_bundle; p = files("battuta_artifacts"); assert (p / "assets/catalog.js").is_file(); assert (p / "templates/index.html").is_file(); [load_bundle(name) for name in ("report", "slides", "live-panel")]'
          HOME="$RUNNER_TEMP/artifact-smoke" "$RUNNER_TEMP/artifact-smoke/bin/python" - <<'PY'
          from battuta_project.registry import ProjectRegistry
          ProjectRegistry().init("release-smoke")
          PY
          for template in report slides live-panel; do
            HOME="$RUNNER_TEMP/artifact-smoke" BATTUTA_ARTIFACT_DB="$RUNNER_TEMP/artifact-smoke/registry.sqlite3" "$RUNNER_TEMP/artifact-smoke/bin/battuta-artifact" init "$template" --project release-smoke --template "$template" --title "Release smoke" --description "Disposable offline template check" --json
            test ! -e "$RUNNER_TEMP/artifact-smoke/.battuta/projects/release-smoke/artifacts/$template/file-meta.json"
          done
          rm -rf "$memory_smoke_home"
          test -x dist/stage/battuta/bots/cos-bot/node_modules/.bin/pi
          test -x dist/stage/battuta/bots/manager-bot/node_modules/.bin/pi
          test -f dist/stage/battuta/bots/manager-bot/.pi/npm/node_modules/pi-subagents/bundle/index.js
          test -f dist/stage/battuta/bots/manager-bot/.pi/npm/node_modules/pi-subagents/skills/pi-subagents/SKILL.md
          test ! -e dist/stage/battuta/bots/cos-bot/node_modules/pi-subagents
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/subagents.json
          pnpm --dir dist/stage/battuta/bots/manager-bot exec node --input-type=module -e 'import upstream from "pi-subagents"; import { SUBAGENT_DELEGATION_REQUEST_EVENT } from "pi-subagents/delegation"; if (typeof upstream !== "function" || !SUBAGENT_DELEGATION_REQUEST_EVENT) process.exit(1)'
          test -d dist/stage/battuta/agent-mail/node_modules
          test -d dist/stage/battuta/project-spec/node_modules
          test -d dist/stage/battuta/memory-client/node_modules
          test ! -e dist/stage/battuta/.env
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/auth.json
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/mcp-auth.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/mcp-auth.json
          test ! -e dist/stage/battuta/bots/cos-bot/.pi/telegram.json
          test ! -e dist/stage/battuta/bots/manager-bot/.pi/telegram.json
          tar -C dist/stage --exclude='battuta/memory-service/.venv' --exclude='battuta/artifact-service/.venv' -czf "dist/battuta-$TAG-linux-arm64.tar.gz" battuta
          (cd dist && sha256sum "battuta-$TAG-linux-arm64.tar.gz" > "battuta-$TAG-linux-arm64.tar.gz.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/battuta-$TAG-linux-arm64.tar.gz" "dist/battuta-$TAG-linux-arm64.tar.gz.sha256" --verify-tag --generate-notes
