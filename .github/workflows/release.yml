name: Release Battuta ARM64 bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: validate
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release provenance and calculate tool version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          echo "version=${TAG#v}+g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  wheels:
    needs: [prepare]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Oracle Linux toolchain image
        run: |
          docker build -t battuta-wheels \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@")[1])')" \
            - < scripts/packaging/OracleAmpere.Dockerfile
      - name: Build release wheels once
        env:
          TAG: ${{ github.ref_name }}
          TOOL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/assets" battuta-wheels \
            bash /source/scripts/packaging/release-wheels.sh "$TAG" "$TOOL_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-wheels
          path: dist/*
          if-no-files-found: error

  build:
    needs: [prepare, wheels]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - platform: oracle-ampere
            dockerfile: OracleAmpere.Dockerfile
          - platform: raspberry-pi
            dockerfile: RaspberryPi.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: release-wheels
          path: wheels
      - name: Build ${{ matrix.platform }} toolchain image
        run: |
          docker build -t "battuta-release-${{ matrix.platform }}" \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@")[1])')" \
            - < "scripts/packaging/${{ matrix.dockerfile }}"
      - name: Assemble ${{ matrix.platform }} release
        env:
          TAG: ${{ github.ref_name }}
          TOOL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/assets" -v "$PWD/wheels:/wheels:ro" \
            "battuta-release-${{ matrix.platform }}" \
            bash /source/scripts/packaging/release-build.sh "${{ matrix.platform }}" "$TAG" "$TOOL_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  prerelease:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Expose immutable candidate assets for installation checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --prerelease --generate-notes

  verify-install:
    needs: [prerelease]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - platform: oracle-ampere
            dockerfile: OracleAmpere.Dockerfile
          - platform: raspberry-pi
            dockerfile: RaspberryPi.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Download the actual published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --dir dist
      - name: Build clean ${{ matrix.platform }} toolchain image
        run: |
          docker build -t "battuta-verify-${{ matrix.platform }}" \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"].split("@")[1])')" \
            - < "scripts/packaging/${{ matrix.dockerfile }}"
      - name: Install and verify without models or bot startup
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/assets:ro" \
            -e BATTUTA_RELEASE_ASSETS=/assets -e BATTUTA_RELEASE_TAG="$TAG" \
            -e BATTUTA_RELEASE_PLATFORM="${{ matrix.platform }}" \
            "battuta-verify-${{ matrix.platform }}" uv run --no-project --python 3.12 \
            --with "pytest>=8,<10" python -m pytest /source/scripts/packaging/tests/integration/test_release_install.py -q

  deploy-supabase:
    name: Deploy Supabase
    needs: [verify-install]
    permissions:
      contents: read
    uses: ./.github/workflows/supabase-deploy.yml
    secrets: inherit

  promote:
    needs: [verify-install, deploy-supabase]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Promote the tested assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --prerelease=false --latest
