name: Install Node check tooling
description: Pinned Node and pnpm with frozen root tooling dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.20.0
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          agent-mail/pnpm-lock.yaml
          project-spec/pnpm-lock.yaml
          memory-stone/pnpm-lock.yaml
          bots/pm-bot/pnpm-lock.yaml
          bots/tl-bot/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        HUSKY: "0"
