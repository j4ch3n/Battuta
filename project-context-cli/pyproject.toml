[project]
name = "battuta-project"
dynamic = ["version"]
description = "Battuta project checkouts, context indexes, and durable memory"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9", "pydantic>=2,<3", "PyYAML>=6,<7", "Jinja2>=3.1,<4", "gql[httpx]>=4.4,<5"]

[project.scripts]
battuta-project = "battuta_project.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battuta_project"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
