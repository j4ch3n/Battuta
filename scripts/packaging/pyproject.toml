[project]
name = "battuta-packaging"
dynamic = ["version"]
description = "Self-contained Battuta release assembly and installation tools"
requires-python = ">=3.12"
dependencies = [
    "battuta-bot-setup>=0.1,<2",
    "click>=8.1,<9",
    "packaging>=24,<27",
]

[tool.uv.sources]
battuta-bot-setup = { path = "../bot_setup", editable = true }

[project.scripts]
battuta-packaging = "battuta_packaging.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pip>=25,<27", "PyYAML>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battuta_packaging"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
