[project]
name = "battuta-bot-setup"
dynamic = ["version"]
description = "Shared source and release configuration for Battuta bots"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9", "pydantic>=2,<3"]

[project.scripts]
battuta-bot-setup = "bot_setup.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_setup"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
