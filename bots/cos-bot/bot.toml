[bot]
role = "cos"
env_prefix = "COS"

[runtime]
pi_coding_agent_dir = "cos-bot/.pi"

[defaults]
provider = "openai"
model = "gpt-6.1-sol"
thinking = "low"

[packages]
pi = [
  "npm:@llblab/pi-telegram@0.59.0",
  "npm:pi-web-access@0.43.0",
  "npm:@jl1990/pi-scheduler@0.5.1",
  "npm:@amaster.ai/pi-browser-use@0.1.38",
]
node_projects = ["agent-mail", "project-spec", "memory-client"]

[[extensions]]
name = "agent-mail"
source = "agent-mail/index.ts"

[[extensions]]
name = "project-spec"
source = "project-spec/index.ts"

[[extensions]]
name = "memory-client"
source = "memory-client/index.ts"

[[extensions]]
name = "dream"
source = "memory-client/dream-extension.ts"

[[files]]
operation = "concatenate"
sources = [
  { root = "repository", path = "bots/AGENTS_shared.md" },
  { root = "profile", path = "AGENTS_dedicated.md" },
]
target = "AGENTS.md"
destination = "profile"
policy = "replace"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/web-search.json" }]
target = ".pi/web-search.json"
destination = "private"
policy = "create-only"
optional = true

[setup]
steps = ["telegram", "mcp", "browser", "dream"]

[skills]
include = [
  "browser-evidence",
  "communicate-with-manager",
  "manage-google",
  "owner-coaching",
  "project-management",
]
