[bot]
role = "worker"
env_prefix = "WORKER"

[worker]
capabilities = []

[worker.types.influencer]
capabilities = ["mobile-control"]

[runtime]
pi_coding_agent_dir = "{instance}/.pi"

[defaults]
model = "anthropic/claude-haiku-5-5"
thinking = "high"

[packages]
pi = [
  "npm:pi-web-access@0.43.0",
  "npm:pi-droid@0.2.0",
]
node_projects = ["assignment-worker", "agent-mail"]

[[extensions]]
name = "assignment-worker"
source = "assignment-worker/index.ts"

[[extensions]]
name = "agent-mail"
source = "agent-mail/index.ts"

[[files]]
operation = "concatenate"
sources = [
  { root = "repository", path = "bots/AGENTS_shared.md" },
  { root = "profile", path = "AGENTS_dedicated.md" },
]
target = "AGENTS.md"
destination = "profile"
policy = "replace"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/web-search.json" }]
target = ".pi/web-search.json"
destination = "private"
policy = "create-only"
optional = true

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/mcp.json" }]
target = ".pi/mcp.json"
destination = "private"
policy = "create-only"
optional = true

[setup]
steps = ["worker-profile"]

[subagents]
agents = []

[skills]
include = [
  "access-remote-files",
  "todo",
  "note-taking",
  "draft-writing",
  "execute-assignment",
  "research",
  "artifacts",
  "prd",
]
