[bot]
role = "worker"
env_prefix = "WORKER"

[packages]
pi = [
  "npm:pi-web-access@0.43.0",
  "npm:@amaster.ai/pi-browser-use@0.1.38",
  "npm:@tintinweb/pi-subagents@0.24.0",
]
node_projects = ["bots/worker/extension/assignment-worker", "agent-mail"]

[[files]]
operation = "concatenate"
sources = [
  { root = "repository", path = "bots/AGENTS_shared.md" },
  { root = "profile", path = "AGENTS_dedicated.md" },
]
target = "AGENTS.md"
destination = "profile"
policy = "replace"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/web-search.json" }]
target = ".pi/web-search.json"
destination = "private"
policy = "create-only"
optional = true

[setup]
steps = ["worker-profile"]

[skills]
include = [
  "todo",
  "note-taking",
  "draft-writing",
  "execute-assignment",
  "research",
  "browser-evidence",
  "artifacts",
  "prd",
]
