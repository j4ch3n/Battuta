[bot]
role = "worker"
env_prefix = "WORKER"

[worker]
capabilities = []

[worker.types.general]
capabilities = ["research"]

[runtime]
pi_coding_agent_dir = "{instance}/.pi"

[defaults]
model = "claude-directsdk/claude-haiku-5-5"
thinking = "medium"

[packages]
pi = [
  "npm:pi-claude-directsdk@1.0.2",
  "npm:pi-web-access@0.48.0",
  "npm:@amaster.ai/pi-browser-use@0.1.41",
  "npm:pi-harness-delegate@0.9.0",
]
pi_library = ["npm:pi-harness-delegate@0.9.0"]
node_projects = ["assignment-worker", "agent-mail"]

[[extensions]]
name = "assignment-worker"
source = "assignment-worker/index.ts"

[[extensions]]
name = "agent-mail"
source = "agent-mail/index.ts"

[[files]]
operation = "concatenate"
sources = [
  { root = "repository", path = "bots/AGENTS_shared.md" },
  { root = "profile", path = "AGENTS_dedicated.md" },
]
target = "AGENTS.md"
destination = "profile"
policy = "replace"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/web-search.json" }]
target = ".pi/web-search.json"
destination = "private"
policy = "create-only"
optional = true

[setup]
steps = ["worker-profile"]

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/mcp.json" }]
target = ".pi/mcp.json"
destination = "private"
policy = "merge"
optional = true

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/delegate/templates/claude/implement.md" }]
target = ".pi/delegate/templates/claude/implement.md"
destination = "private"
policy = "create-only"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/delegate/templates/claude/research.md" }]
target = ".pi/delegate/templates/claude/research.md"
destination = "private"
policy = "create-only"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/delegate/templates/claude/review.md" }]
target = ".pi/delegate/templates/claude/review.md"
destination = "private"
policy = "create-only"

[[files]]
operation = "copy"
sources = [{ root = "profile", path = ".pi/delegate/templates/claude/plan.md" }]
target = ".pi/delegate/templates/claude/plan.md"
destination = "private"
policy = "create-only"

# Skills shared with Claude Code sessions on the host, copied from the catalog independently of the selection below.
[claude]
skills = ["research", "read-documents"]

[skills]
include = [
  "access-remote-files",
  "todo",
  "note-taking",
  "draft-writing",
  "execute-assignment",
  "research",
  "browser-evidence",
  "artifacts",
  "prd",
]
